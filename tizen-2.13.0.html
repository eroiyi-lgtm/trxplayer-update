<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b14">
<title>TrxPlayer</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrxPlayer">
<link rel="stylesheet" href="fonts/inter.css">
<style>:root {
  --bg: #070b14;
  --bg2: #0b1120;
  --s1: #111a2c;
  --s2: #17223a;
  --s3: #1f2c48;
  --line: #24324f;
  --tx: #eef3fb;
  --tx2: #a3b0c8;
  --tx3: #66758f;
  --acc: #ff6a3d;
  --acc2: #ff8c5a;
  --acc-bg: #ff6a3d29;
  --on-acc: #160803;
  --live: #ff3b4f;
  --ok: #3ddc97;
  --warn: #ffc24a;
  --r: .6rem;
  --r2: 1rem;
  --rail: 5.8rem;
  --panel: #111a2ca6;
  --railbg: #090e1beb;
  font-size: max(8px, min(1.0417vw, 1.852vh));
}

:root[data-accent="azur"] {
  --acc: #2a7fff;
  --acc2: #5c9dff;
  --acc-bg: #2a7fff2e;
  --on-acc: #fff;
}

:root[data-accent="ice"] {
  --acc: #3cc8ef;
  --acc2: #7adcf7;
  --acc-bg: #3cc8ef29;
  --on-acc: #02141a;
}

:root[data-accent="lime"] {
  --acc: #a6e22e;
  --acc2: #c4ef6b;
  --acc-bg: #a6e22e26;
  --on-acc: #0f1600;
}

:root[data-accent="violet"] {
  --acc: #9b87ff;
  --acc2: #b9aaff;
  --acc-bg: #9b87ff2b;
  --on-acc: #0c0720;
}

:root[data-accent="mint"] {
  --acc: #2ee6a0;
  --acc2: #74f1c4;
  --acc-bg: #2ee6a029;
  --on-acc: #02140c;
  --bg: #0a0a0c;
  --bg2: #0e0e11;
  --s1: #151518;
  --s2: #1c1c21;
  --s3: #26262d;
  --line: #2b2b33;
  --tx: #f3f3f5;
  --tx2: #a9a9b4;
  --tx3: #6b6b76;
  --panel: #16161ab8;
  --railbg: #0b0b0d;
}

:root[data-accent="mint"] body {
  background: var(--bg);
}

* {
  box-sizing: border-box;
  scrollbar-width: none;
  margin: 0;
  padding: 0;
}

::-webkit-scrollbar {
  background: none;
  width: 0;
  height: 0;
  display: none;
}

html, body {
  background: var(--bg);
  color: var(--tx);
  height: 100%;
  overflow: hidden;
}

body {
  background: radial-gradient(ellipse 70% 60% at 85% -10%, #2a7fff29, transparent 70%), radial-gradient(ellipse 60% 50% at 0% 110%, #7846ff1a, transparent 70%), var(--bg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size: 1rem;
  line-height: 1.35;
}

button, input, select {
  font: inherit;
  color: inherit;
  text-align: left;
  background: none;
  border: 0;
  outline: 0;
}

img {
  display: block;
}

.ic {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8px;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
  width: 1.5em;
  height: 1.5em;
}

.hide {
  display: none !important;
}

.muted {
  color: var(--tx2);
}

.clamp2 {
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
}

.clamp5 {
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
}

.clamp3 {
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
}

.ell {
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}

#app {
  z-index: 2;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#app.off {
  visibility: hidden;
}

#rail {
  width: var(--rail);
  background: var(--railbg);
  border-right: 1px solid var(--line);
  z-index: 4;
  flex-direction: column;
  align-items: center;
  gap: .3rem;
  padding: 1.2rem .5rem;
  display: flex;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
}

#rail .logo {
  justify-content: center;
  align-items: center;
  height: 3rem;
  margin-bottom: 1.6rem;
  display: flex;
}

#rail .logo svg {
  flex: none;
  width: 2.7rem;
  height: 2.7rem;
}

#rail .logo b {
  display: none;
}

.ri {
  color: var(--tx3);
  cursor: pointer;
  border-radius: 1rem;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: .2rem;
  width: 4.4rem;
  height: 4rem;
  transition: background .15s, color .15s;
  display: flex;
  position: relative;
}

.ri .ic {
  width: 1.6rem;
  height: 1.6rem;
}

.ri span {
  letter-spacing: .01em;
  white-space: nowrap;
  text-overflow: ellipsis;
  max-width: 4.3rem;
  font-size: .62rem;
  font-weight: 700;
  display: none;
  overflow: hidden;
}

.ri.cur {
  color: var(--acc);
}

.ri.cur span, .ri:focus span {
  display: block;
}

.ri:focus {
  background: var(--acc);
  color: var(--on-acc);
}

#rail .sp {
  flex: 1;
}

#rail .clock {
  font-variant-numeric: tabular-nums;
  color: var(--tx2);
  white-space: nowrap;
  padding: 0 .55rem;
  font-size: 1.05rem;
  font-weight: 700;
}

#main {
  margin-left: var(--rail);
  flex: 1;
  min-width: 0;
  position: relative;
}

.scr {
  display: none;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.scr.on {
  display: block;
}

#vbox {
  z-index: 1;
  background: #000;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  overflow: hidden;
}

#vbox.pv {
  z-index: 3;
  border-radius: var(--r);
  box-shadow: 0 0 0 1px var(--line);
}

#vbox video {
  object-fit: contain;
  background: #000;
  width: 100%;
  height: 100%;
  display: block;
}

#vbox.a-cover video {
  object-fit: cover;
}

#vbox.a-fill video {
  object-fit: fill;
}

#vbox.a-169 video {
  object-fit: fill;
  aspect-ratio: 16 / 9;
  height: auto;
  max-height: 100%;
  margin: auto;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#vbox.a-43 video {
  object-fit: fill;
  aspect-ratio: 4 / 3;
  width: auto;
  height: 100%;
  margin: auto;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#vbox.idle {
  visibility: hidden;
}

:root[data-droid], :root[data-droid] body, :root[data-droid] #vbox, :root[data-droid] #vbox video {
  background: none !important;
}

:root[data-droid] #vbox.pv {
  box-shadow: none;
}

.spin {
  pointer-events: none;
  place-items: center;
  display: grid;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.spin > div {
  border-radius: var(--r2);
  background: #0a0c10b8;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding: 1.4rem 2rem;
  display: flex;
}

.spin i {
  border: .3rem solid #ffffff26;
  border-top-color: var(--acc);
  border-radius: 50%;
  width: 3rem;
  height: 3rem;
  animation: .8s linear infinite rot;
}

.pv .spin > div {
  background: none;
  padding: .8rem;
}

.pv .spin span {
  display: none;
}

.pv .spin i {
  width: 2rem;
  height: 2rem;
}

@keyframes rot {
  to {
    transform: rotate(360deg);
  }
}

.verr {
  text-align: center;
  background: #050609d1;
  place-items: center;
  padding: 2rem;
  display: grid;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.verr b {
  margin-bottom: .5rem;
  font-size: 1.4rem;
  display: block;
}

.pv .verr b {
  font-size: 1rem;
}

.pv .verr p {
  display: none;
}

#osd {
  z-index: 6;
  pointer-events: none;
  display: none;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#osd.on {
  display: block;
}

#osd > * {
  pointer-events: auto;
}

.ibar {
  background: linear-gradient(#05080e00, #05080eb8 38%, #05080eed);
  grid-template-columns: auto 5.4rem 1fr auto;
  align-items: center;
  gap: 0 1.2rem;
  padding: 5rem 2.6rem 1.7rem;
  display: grid;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}

.ibar .num {
  font-variant-numeric: tabular-nums;
  color: var(--acc);
  text-align: right;
  min-width: 2.6rem;
  font-size: 2rem;
  font-weight: 800;
}

.ibar .lg {
  color: var(--tx2);
  background: #ffffff14 center / contain no-repeat;
  border-radius: .5rem;
  place-items: center;
  width: 5.4rem;
  height: 3.4rem;
  font-weight: 800;
  display: grid;
}

.ibar .mid {
  min-width: 0;
}

.ibar .chn {
  color: var(--tx2);
  align-items: center;
  gap: .7rem;
  font-size: .95rem;
  font-weight: 600;
  display: flex;
}

.ibar .now {
  margin: .1rem 0 0;
  font-size: 1.4rem;
  font-weight: 700;
}

.ibar .nxt {
  color: var(--tx2);
  margin-top: .3rem;
  font-size: .9rem;
}

.ibar .nxt b {
  color: var(--tx);
  font-weight: 600;
}

.ibar .rt {
  text-align: right;
  color: var(--tx2);
  flex-direction: column;
  align-items: flex-end;
  gap: .35rem;
  font-size: .9rem;
  display: flex;
}

.ibar .rt .clk {
  color: var(--tx);
  font-variant-numeric: tabular-nums;
  font-size: 1.35rem;
  font-weight: 700;
}

.ibar .pl {
  background: #ffffff29;
  border-radius: 1rem;
  grid-column: 1 / -1;
  height: .22rem;
  margin-top: 1.1rem;
  position: relative;
}

.ibar .pl i {
  background: var(--acc);
  border-radius: 1rem;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
}

.ibar .pl .lv {
  color: var(--tx3);
  font-variant-numeric: tabular-nums;
  font-size: .8rem;
  position: absolute;
  top: .5rem;
  left: 0;
}

.ibar .pl .lv.r {
  left: auto;
  right: 0;
}

@keyframes ovUp {
  from {
    opacity: 0;
    transform: translateY(1.5rem);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes ovL {
  from {
    opacity: .3;
    transform: translateX(-100%);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.ibar.in {
  animation: .3s cubic-bezier(.2, .8, .2, 1) both ovUp;
}

.chl.in {
  animation: .32s cubic-bezier(.2, .8, .2, 1) both ovL;
}

.ibar.out {
  animation: .2s ease-in reverse both ovUp;
}

.chl.out {
  animation: .22s ease-in reverse both ovL;
}

.bar {
  background: #ffffff1f;
  border-radius: 1rem;
  height: .35rem;
  overflow: hidden;
}

.bar > i {
  background: var(--acc);
  border-radius: 1rem;
  height: 100%;
  display: block;
}

.tag {
  letter-spacing: .04em;
  text-transform: uppercase;
  background: var(--s3);
  color: var(--tx2);
  border-radius: .35rem;
  align-items: center;
  gap: .3rem;
  padding: .18rem .5rem;
  font-size: .75rem;
  font-weight: 800;
  display: inline-flex;
}

.tag.live {
  background: var(--live);
  color: #fff;
}

.tag.acc {
  background: var(--acc);
  color: var(--on-acc);
}

.tag .ic {
  width: .95rem;
  height: .95rem;
}

.seek {
  border: 1px solid var(--line);
  border-radius: var(--r2);
  background: #0c0e13f2;
  padding: 1.3rem 1.6rem;
  position: absolute;
  bottom: 2.2rem;
  left: 2.5rem;
  right: 2.5rem;
}

.seek .t {
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: .9rem;
  display: flex;
}

.seek .t b {
  font-size: 1.4rem;
}

.seek .bar {
  height: .5rem;
  position: relative;
  overflow: visible;
}

.seek .bar u {
  box-shadow: 0 0 0 .3rem var(--acc-bg);
  background: #fff;
  border-radius: 50%;
  width: 1.1rem;
  height: 1.1rem;
  margin: -.55rem 0 0 -.55rem;
  position: absolute;
  top: 50%;
}

.seek .tm {
  color: var(--tx2);
  font-variant-numeric: tabular-nums;
  justify-content: space-between;
  margin-top: .7rem;
  display: flex;
}

.seek .st {
  align-items: center;
  gap: .6rem;
  font-weight: 700;
  display: flex;
}

.numbox {
  border: 1px solid var(--acc);
  border-radius: var(--r2);
  text-align: right;
  background: #0c0e13f2;
  min-width: 9rem;
  padding: .8rem 1.4rem;
  position: absolute;
  top: 2rem;
  right: 2.5rem;
}

.numbox b {
  color: var(--acc);
  font-variant-numeric: tabular-nums;
  letter-spacing: .08em;
  font-size: 3rem;
  font-weight: 800;
}

.numbox div {
  color: var(--tx2);
  max-width: 18rem;
  font-size: .95rem;
}

.chl {
  background: linear-gradient(90deg, #080a0ef7 0, #080a0eed 80%, #080a0e00);
  padding-right: 6rem;
  display: flex;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
}

.chl .col {
  flex-direction: column;
  width: 34rem;
  padding: 1.8rem 0 1.8rem 1.6rem;
  display: flex;
}

.chl .col.pr {
  border-left: 1px solid var(--line);
  width: 30rem;
  padding-left: 1.2rem;
}

.chl .gh {
  justify-content: space-between;
  align-items: center;
  gap: .5rem;
  padding: 0 1rem .9rem .5rem;
  display: flex;
}

.chl .gh b {
  font-size: 1.25rem;
}

.chl .gh .muted {
  font-size: .9rem;
}

.chl .lst {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.cr {
  border-radius: var(--r);
  grid-template-columns: 3.2rem 4.4rem 1fr;
  align-items: center;
  gap: .9rem;
  height: 4.6rem;
  padding: 0 1rem 0 .5rem;
  display: grid;
  position: absolute;
  left: 0;
  right: 0;
}

.cr .n {
  text-align: right;
  color: var(--tx3);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

.cr .lg {
  background: var(--s2) center / contain no-repeat;
  color: var(--tx3);
  border-radius: .4rem;
  place-items: center;
  width: 4.4rem;
  height: 2.8rem;
  font-size: .8rem;
  font-weight: 800;
  display: grid;
}

.cr .t {
  min-width: 0;
}

.cr .t b {
  align-items: center;
  gap: .4rem;
  font-weight: 600;
  display: flex;
}

.cr .t b .ic {
  color: var(--acc);
  width: 1rem;
  height: 1rem;
}

.cr .t span {
  color: var(--tx2);
  margin: .15rem 0 .35rem;
  font-size: .88rem;
  display: block;
}

.cr .bar {
  height: .22rem;
}

.cr.f {
  background: var(--acc);
  color: var(--on-acc);
}

.cr.f .n, .cr.f .t span {
  color: var(--on-acc);
  opacity: .8;
}

.cr.f .bar {
  background: #0003;
}

.cr.f .bar i {
  background: var(--on-acc);
}

.cr.f .t b .ic {
  color: var(--on-acc);
}

.cr.cur:not(.f) {
  background: var(--s2);
}

.cr.cur .n {
  color: var(--acc);
}

.cr.f .n, .cr.f.cur .n, .pr .cr.f .n {
  color: var(--on-acc);
  opacity: .85;
}

.cr .n .ic {
  width: 1.2rem;
  height: 1.2rem;
}

.pr .cr {
  grid-template-columns: 5.2rem 1fr;
  height: 4.2rem;
}

.pr .cr .n {
  text-align: left;
  color: var(--tx2);
  font-size: .95rem;
}

.pr .cr.past .t b {
  color: var(--tx2);
  font-weight: 500;
}

.pr .cr.f .t b {
  color: var(--on-acc);
}

.side {
  border-left: 1px solid var(--line);
  background: #0c0e13f7;
  flex-direction: column;
  gap: .3rem;
  width: 30rem;
  padding: 2rem 1.4rem;
  display: flex;
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  overflow: hidden;
}

.side h3 {
  padding: 0 .9rem .9rem;
  font-size: 1.3rem;
}

.side .sub {
  color: var(--tx2);
  margin-top: -.6rem;
  padding: 0 .9rem 1rem;
  font-size: .9rem;
}

.li {
  border-radius: var(--r);
  cursor: pointer;
  text-align: left;
  align-items: center;
  gap: .9rem;
  width: 100%;
  min-height: 3.4rem;
  padding: .55rem .9rem;
  display: flex;
}

.li .ic {
  color: var(--tx2);
  width: 1.4rem;
  height: 1.4rem;
}

.li .lt {
  flex: 1;
  min-width: 0;
}

.li .lt small {
  color: var(--tx2);
  margin-top: .1rem;
  font-size: .85rem;
  display: block;
}

.li .val {
  color: var(--tx2);
  text-align: right;
  max-width: 45%;
  font-size: .95rem;
}

.li.sel .val, .li.sel .ic {
  color: var(--acc);
}

.li:focus, .li.f {
  background: var(--acc);
  color: var(--on-acc);
}

.li:focus .ic, .li:focus .val, .li:focus small, .li.f .ic, .li.f .val, .li.f small {
  color: var(--on-acc);
}

.li[disabled] {
  opacity: .45;
}

.sw {
  background: var(--s3);
  border-radius: 1rem;
  flex: none;
  width: 2.8rem;
  height: 1.6rem;
  position: relative;
}

.sw:after {
  content: "";
  background: var(--tx2);
  border-radius: 50%;
  width: 1.2rem;
  height: 1.2rem;
  transition: transform .15s;
  position: absolute;
  top: .2rem;
  left: .2rem;
}

.sw.on {
  background: var(--acc);
}

.sw.on:after {
  background: var(--on-acc);
  transform: translateX(1.2rem);
}

.li:focus .sw {
  background: #00000040;
}

.li:focus .sw.on:after {
  background: #fff;
}

#s-guide {
  flex-direction: column;
  display: none;
}

#s-guide.on {
  display: flex;
}

.gtop {
  flex: none;
  grid-template-columns: 1fr 30rem;
  gap: 2rem;
  height: 17.5rem;
  padding: 1.6rem 2rem 1rem;
  display: grid;
}

.gdet {
  flex-direction: column;
  min-width: 0;
  display: flex;
}

.gdet .ch {
  color: var(--tx2);
  align-items: center;
  gap: .7rem;
  font-weight: 600;
  display: flex;
}

.gdet .ch .lg {
  background: var(--s2) center / contain no-repeat;
  border-radius: .35rem;
  width: 3.4rem;
  height: 2.1rem;
}

.gdet h2 {
  letter-spacing: -.02em;
  margin: .6rem 0 .3rem;
  font-size: 2rem;
  line-height: 1.15;
