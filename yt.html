<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Trailer</title>
<!-- TrxPlayer-Trailerfenster: YouTube braucht eine echte Webadresse (sonst Fehler 153 in TV-Apps ohne Adresse, z. B. LG) -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0}</style></head>
<body><iframe id="f" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
var v = (new URLSearchParams(location.search).get('v') || '').replace(/[^\w-]/g, '').slice(0, 11);
var f = document.getElementById('f');
f.src = 'https://www.youtube-nocookie.com/embed/' + v + '?autoplay=1&rel=0&playsinline=1&fs=0&iv_load_policy=3&enablejsapi=1&hl=de&origin=' + encodeURIComponent(location.origin);
// Befehle der App (Pause, Spulen) an YouTube weiterreichen, Statusmeldungen zurück an die App
addEventListener('message', function (e) {
  if (e.source === f.contentWindow) parent.postMessage(e.data, '*');
  else if (e.source === parent) f.contentWindow.postMessage(e.data, '*');
});
f.onload = function () { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); };
</script></body></html>
