<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12201a">
<title>Moxvela Player</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moxvela">
<link rel="stylesheet" href="fonts/inter.css">
<style>:root {
  --bg: #070b14;
  --bg2: #0b1120;
  --s1: #111a2c;
  --s2: #17223a;
  --s3: #1f2c48;
  --line: #24324f;
  --tx: #eef3fb;
  --tx2: #a3b0c8;
  --tx3: #66758f;
  --acc: #ff6a3d;
  --acc2: #ff8c5a;
  --acc-bg: #ff6a3d29;
  --on-acc: #160803;
  --live: #ff3b4f;
  --ok: #3ddc97;
  --warn: #ffc24a;
  --r: .6rem;
  --r2: 1rem;
  --rail: 5.8rem;
  --panel: #111a2ca6;
  --railbg: #090e1beb;
  font-size: max(8px, min(1.0417vw, 1.852vh));
}

:root[data-accent="azur"] {
  --acc: #2a7fff;
  --acc2: #5c9dff;
  --acc-bg: #2a7fff2e;
  --on-acc: #fff;
}

:root[data-accent="ice"] {
  --acc: #3cc8ef;
  --acc2: #7adcf7;
  --acc-bg: #3cc8ef29;
  --on-acc: #02141a;
}

:root[data-accent="lime"] {
  --acc: #a6e22e;
  --acc2: #c4ef6b;
  --acc-bg: #a6e22e26;
  --on-acc: #0f1600;
}

:root[data-accent="violet"] {
  --acc: #9b87ff;
  --acc2: #b9aaff;
  --acc-bg: #9b87ff2b;
  --on-acc: #0c0720;
}

:root[data-accent="mint"] {
  --acc: #2ee6a0;
  --acc2: #74f1c4;
  --acc-bg: #2ee6a029;
  --on-acc: #02140c;
  --bg: #0a0a0c;
  --bg2: #0e0e11;
  --s1: #151518;
  --s2: #1c1c21;
  --s3: #26262d;
  --line: #2b2b33;
  --tx: #f3f3f5;
  --tx2: #a9a9b4;
  --tx3: #6b6b76;
  --panel: #16161ab8;
  --railbg: #0b0b0d;
}

:root[data-accent="mint"] body {
  background: var(--bg);
}

* {
  box-sizing: border-box;
  scrollbar-width: none;
  margin: 0;
  padding: 0;
}

::-webkit-scrollbar {
  background: none;
  width: 0;
  height: 0;
  display: none;
}

html, body {
  background: var(--bg);
  color: var(--tx);
  height: 100%;
  overflow: hidden;
}

body {
  background: radial-gradient(ellipse 70% 60% at 85% -10%, #2a7fff29, transparent 70%), radial-gradient(ellipse 60% 50% at 0% 110%, #7846ff1a, transparent 70%), var(--bg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size: 1rem;
  line-height: 1.35;
}

button, input, select {
  font: inherit;
  color: inherit;
  text-align: left;
  background: none;
  border: 0;
  outline: 0;
}

img {
  display: block;
}

.ic {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8px;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
  width: 1.5em;
  height: 1.5em;
}

.hide {
  display: none !important;
}

.muted {
  color: var(--tx2);
}

.clamp2 {
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
}

.clamp5 {
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
}

.clamp3 {
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
}

.ell {
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
}

#app {
  z-index: 2;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display: flex;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#app.off {
  visibility: hidden;
}

#rail {
  width: var(--rail);
  background: var(--railbg);
  border-right: 1px solid var(--line);
  z-index: 4;
  flex-direction: column;
  align-items: center;
  gap: .3rem;
  padding: 1.2rem .5rem;
  display: flex;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
}

#rail .logo {
  justify-content: center;
  align-items: center;
  height: 3rem;
  margin-bottom: 1.6rem;
  display: flex;
}

#rail .logo svg {
  flex: none;
  width: 2.7rem;
  height: 2.7rem;
}

#rail .logo b {
  display: none;
}

.ri {
  color: var(--tx3);
  cursor: pointer;
  border-radius: 1rem;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: .2rem;
  width: 4.4rem;
  height: 4rem;
  transition: background .15s, color .15s;
  display: flex;
  position: relative;
}

.ri .ic {
  width: 1.6rem;
  height: 1.6rem;
}

.ri span {
  letter-spacing: .01em;
  white-space: nowrap;
  text-overflow: ellipsis;
  max-width: 4.3rem;
  font-size: .62rem;
  font-weight: 700;
  display: none;
  overflow: hidden;
}

.ri.cur {
  color: var(--acc);
}

.ri.cur span, .ri:focus span {
  display: block;
}

.ri:focus {
  background: var(--acc);
  color: var(--on-acc);
}

#rail .sp {
  flex: 1;
}

#rail .clock {
  font-variant-numeric: tabular-nums;
  color: var(--tx2);
  white-space: nowrap;
  padding: 0 .55rem;
  font-size: 1.05rem;
  font-weight: 700;
}

#main {
  margin-left: var(--rail);
  flex: 1;
  min-width: 0;
  position: relative;
}

.scr {
  display: none;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.scr.on {
  display: block;
}

#vbox {
  z-index: 1;
  background: #000;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
  overflow: hidden;
}

#vbox.pv {
  z-index: 3;
  border-radius: var(--r);
  box-shadow: 0 0 0 1px var(--line);
}

#vbox video {
  object-fit: contain;
  background: #000;
  width: 100%;
  height: 100%;
  display: block;
}

#vbox.a-cover video {
  object-fit: cover;
}

#vbox.a-fill video {
  object-fit: fill;
}

#vbox.a-169 video {
  object-fit: fill;
  aspect-ratio: 16 / 9;
  height: auto;
  max-height: 100%;
  margin: auto;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#vbox.a-43 video {
  object-fit: fill;
  aspect-ratio: 4 / 3;
  width: auto;
  height: 100%;
  margin: auto;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#vbox.idle {
  visibility: hidden;
}

:root[data-droid], :root[data-droid] body, :root[data-droid] #vbox, :root[data-droid] #vbox video {
  background: none !important;
}

:root[data-droid] #vbox video {
  visibility: hidden !important;
}

:root[data-droid] #vbox.pv {
  box-shadow: none;
}

#vbox.pv:not(.idle) {
  cursor: pointer;
}

#vbox.pv.f, :root[data-droid] #vbox.pv.f {
  box-shadow: 0 0 0 .25rem var(--acc), 0 1.2rem 2.6rem #00000073;
}

#vbox.pv.f:after {
  content: "OK  ▶  Vollbild";
  z-index: 3;
  background: var(--acc);
  color: var(--on-acc);
  letter-spacing: .02em;
  white-space: pre;
  pointer-events: none;
  border-radius: 99px;
  padding: .35rem .8rem;
  font-size: .85rem;
  font-weight: 800;
  line-height: 1.2;
  position: absolute;
  top: .7rem;
  right: .7rem;
}

.spin {
  pointer-events: none;
  place-items: center;
  display: grid;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.spin > div {
  border-radius: var(--r2);
  background: #0a0c10b8;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding: 1.4rem 2rem;
  display: flex;
}

.spin i {
  border: .3rem solid #ffffff26;
  border-top-color: var(--acc);
  border-radius: 50%;
  width: 3rem;
  height: 3rem;
  animation: .8s linear infinite rot;
}

.pv .spin > div {
  background: none;
  padding: .8rem;
}

.pv .spin span {
  display: none;
}

.pv .spin i {
  width: 2rem;
  height: 2rem;
}

@keyframes rot {
  to {
    transform: rotate(360deg);
  }
}

.verr {
  text-align: center;
  background: #050609d1;
  place-items: center;
  padding: 2rem;
  display: grid;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.verr b {
  margin-bottom: .5rem;
  font-size: 1.4rem;
  display: block;
}

.pv .verr b {
  font-size: 1rem;
}

.pv .verr p {
  display: none;
}

#osd {
  z-index: 6;
  pointer-events: none;
  display: none;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

#osd.on {
  display: block;
}

#osd > * {
  pointer-events: auto;
}

.ibar {
  background: linear-gradient(#05080e00, #05080eb8 38%, #05080eed);
  grid-template-columns: auto 5.4rem 1fr auto;
  align-items: center;
  gap: 0 1.2rem;
  padding: 5rem 2.6rem 1.7rem;
  display: grid;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}

.ibar .num {
  font-variant-numeric: tabular-nums;
  color: var(--acc);
  text-align: right;
  min-width: 2.6rem;
  font-size: 2rem;
  font-weight: 800;
}

.ibar .lg {
  color: var(--tx2);
  background: #ffffff14 center / contain no-repeat;
  border-radius: .5rem;
  place-items: center;
  width: 5.4rem;
  height: 3.4rem;
  font-weight: 800;
  display: grid;
}

.ibar .mid {
  min-width: 0;
}

.ibar .chn {
  color: var(--tx2);
  align-items: center;
  gap: .7rem;
  font-size: .95rem;
  font-weight: 600;
  display: flex;
}

.ibar .now {
  margin: .1rem 0 0;
  font-size: 1.4rem;
  font-weight: 700;
}

.ibar .nxt {
  color: var(--tx2);
  margin-top: .3rem;
  font-size: .9rem;
}

.ibar .nxt b {
  color: var(--tx);
  font-weight: 600;
}

.ibar .rt {
  text-align: right;
  color: var(--tx2);
  flex-direction: column;
  align-items: flex-end;
  gap: .35rem;
  font-size: .9rem;
  display: flex;
}

.ibar .rt .clk {
  color: var(--tx);
  font-variant-numeric: tabular-nums;
  font-size: 1.35rem;
  font-weight: 700;
}

.ibar .pl {
  background: #ffffff29;
  border-radius: 1rem;
  grid-column: 1 / -1;
  height: .22rem;
  margin-top: 1.1rem;
  position: relative;
}

.ibar .pl i {
  background: var(--acc);
  border-radius: 1rem;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
}

.ibar .pl .lv {
  color: var(--tx3);
  font-variant-numeric: tabular-nums;
  font-size: .8rem;
  position: absolute;
  top: .5rem;
  left: 0;
}

.ibar .pl .lv.r {
  left: auto;
  right: 0;
}

@keyframes ovUp {
  from {
    opacity: 0;
    transform: translateY(1.5rem);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes ovL {
  from {
    opacity: .3;
    transform: translateX(-100%);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.ibar.in {
  animation: .3s cubic-bezier(.2, .8, .2, 1) both ovUp;
}

.chl.in {
  animation: .32s cubic-bezier(.2, .8, .2, 1) both ovL;
}

.ibar.out {
  animation: .2s ease-in reverse both ovUp;
}

.chl.out {
  animation: .22s ease-in reverse both ovL;
}

.bar {
  background: #ffffff1f;
  border-radius: 1rem;
  height: .35rem;
  overflow: hidden;
}

.bar > i {
  background: var(--acc);
  border-radius: 1rem;
  height: 100%;
  display: block;
}

.tag {
  letter-spacing: .04em;
  text-transform: uppercase;
  background: var(--s3);
  color: var(--tx2);
  border-radius: .35rem;
  align-items: center;
  gap: .3rem;
  padding: .18rem .5rem;
  font-size: .75rem;
  font-weight: 800;
  display: inline-flex;
}

.tag.live {
  background: var(--live);
  color: #fff;
}

.tag.acc {
  background: var(--acc);
  color: var(--on-acc);
}

.tag .ic {
  width: .95rem;
  height: .95rem;
}

.seek {
  border: 1px solid var(--line);
  border-radius: var(--r2);
  background: #0c0e13f2;
  padding: 1.3rem 1.6rem;
  position: absolute;
  bottom: 2.2rem;
  left: 2.5rem;
  right: 2.5rem;
}

.seek .t {
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: .9rem;
  display: flex;
}

.seek .t b {
  font-size: 1.4rem;
}

.seek .bar {
  height: .5rem;
  position: relative;
  overflow: visible;
}

.seek .bar u {
  box-shadow: 0 0 0 .3rem var(--acc-bg);
  background: #fff;
  border-radius: 50%;
  width: 1.1rem;
  height: 1.1rem;
  margin: -.55rem 0 0 -.55rem;
  position: absolute;
  top: 50%;
}

.seek .tm {
  color: var(--tx2);
  font-variant-numeric: tabular-nums;
  justify-content: space-between;
  margin-top: .7rem;
  display: flex;
}

.seek .st {
  align-items: center;
  gap: .6rem;
  font-weight: 700;
  display: flex;
}

.numbox {
  border: 1px solid var(--acc);
  border-radius: var(--r2);
  text-align: right;
  background: #0c0e13f2;
  min-width: 9rem;
  padding: .8rem 1.4rem;
  position: absolute;
  top: 2rem;
  right: 2.5rem;
}

.numbox b {
  color: var(--acc);
  font-variant-numeric: tabular-nums;
  letter-spacing: .08em;
  font-size: 3rem;
  font-weight: 800;
}

.numbox div {
  color: var(--tx2);
  max-width: 18rem;
  font-size: .95rem;
}

.chl {
  background: linear-gradient(90deg, #080a0ef7 0, #080a0eed 80%, #080a0e00);
  padding-right: 6rem;
  display: flex;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
}

.chl .col {
  flex-direction: column;
  width: 34rem;
  padding: 1.8rem 0 1.8rem 1.6rem;
  display: flex;
}

.chl .col.pr {
  border-left: 1px solid var(--line);
  width: 30rem;
  padding-left: 1.2rem;
}

.chl .gh {
  justify-content: space-between;
  align-items: center;
  gap: .5rem;
  padding: 0 1rem .9rem .5rem;
  display: flex;
}

.chl .gh b {
  font-size: 1.25rem;
}

.chl .gh .muted {
  font-size: .9rem;
}

.chl .lst {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.cr {
  border-radius: var(--r);
  grid-template-columns: 3.2rem 4.4rem 1fr;
  align-items: center;
  gap: .9rem;
  height: 4.6rem;
  padding: 0 1rem 0 .5rem;
  display: grid;
  position: absolute;
  left: 0;
  right: 0;
}

.cr .n {
  text-align: right;
  color: var(--tx3);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

.cr .lg {
  background: var(--s2) center / contain no-repeat;
  color: var(--tx3);
  border-radius: .4rem;
  place-items: center;
  width: 4.4rem;
  height: 2.8rem;
  font-size: .8rem;
  font-weight: 800;
  display: grid;
}

.cr .t {
  min-width: 0;
}

.cr .t b {
  align-items: center;
  gap: .4rem;
  font-weight: 600;
  display: flex;
}

.cr .t b .ic {
  color: var(--acc);
  width: 1rem;
  height: 1rem;
}

.cr .t span {
  color: var(--tx2);
  margin: .15rem 0 .35rem;
  font-size: .88rem;
  display: block;
}

.cr .bar {
  height: .22rem;
}

.cr.f {
  background: var(--acc);
  color: var(--on-acc);
}

.cr.f .n, .cr.f .t span {
  color: var(--on-acc);
  opacity: .8;
}

.cr.f .bar {
  background: #0003;
}

.cr.f .bar i {
  background: var(--on-acc);
}

.cr.f .t b .ic {
  color: var(--on-acc);
}

.cr.cur:not(.f) {
  background: var(--s2);
}

.cr.cur .n {
  color: var(--acc);
}

.cr.f .n, .cr.f.cur .n, .pr .cr.f .n {
  color: var(--on-acc);
  opacity: .85;
}

.cr .n .ic {
  width: 1.2rem;
  height: 1.2rem;
}

.pr .cr {
  grid-template-columns: 5.2rem 1fr;
  height: 4.2rem;
}

.pr .cr .n {
  text-align: left;
  color: var(--tx2);
  font-size: .95rem;
}

.pr .cr.past .t b {
  color: var(--tx2);
  font-weight: 500;
}

.pr .cr.f .t b {
  color: var(--on-acc);
}

.side {
  border-left: 1px solid var(--line);
  background: #0c0e13f7;
  flex-direction: column;
  gap: .3rem;
  width: 30rem;
  padding: 2rem 1.4rem;
  display: flex;
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  overflow: hidden;
}

.side h3 {
  padding: 0 .9rem .9rem;
  font-size: 1.3rem;
}

.side .sub {
  color: var(--tx2);
  margin-top: -.6rem;
  padding: 0 .9rem 1rem;
  font-size: .9rem;
}

.li {
  border-radius: var(--r);
  cursor: pointer;
  text-align: left;
  align-items: center;
  gap: .9rem;
  width: 100%;
  min-height: 3.4rem;
  padding: .55rem .9rem;
  display: flex;
}

.li .ic {
  color: var(--tx2);
  width: 1.4rem;
  height: 1.4rem;
}

.li .lt {
  flex: 1;
  min-width: 0;
}

.li .lt small {
  color: var(--tx2);
  margin-top: .1rem;
  font-size: .85rem;
  display: block;
}

.li .val {
  color: var(--tx2);
  text-align: right;
  max-width: 45%;
  font-size: .95rem;
}

.li.sel .val, .li.sel .ic {
  color: var(--acc);
}

.li:focus, .li.f {
  background: var(--acc);
  color: var(--on-acc);
}

.li:focus .ic, .li:focus .val, .li:focus small, .li.f .ic, .li.f .val, .li.f small {
  color: var(--on-acc);
}

.li[disabled] {
  opacity: .45;
}

.sw {
  background: var(--s3);
  border-radius: 1rem;
  flex: none;
  width: 2.8rem;
  height: 1.6rem;
  position: relative;
}

.sw:after {
  content: "";
  background: var(--tx2);
  border-radius: 50%;
  width: 1.2rem;
  height: 1.2rem;
  transition: transform .15s;
  position: absolute;
  top: .2rem;
  left: .2rem;
}

.sw.on {
  background: var(--acc);
}

.sw.on:after {
  background: var(--on-acc);
  transform: translateX(1.2rem);
}

.li:focus .sw {
  background: #00000040;
}

.li:focus .sw.on:after {
  background: #fff;
}

#s-guide {
  flex-direction: column;
  display: none;
}

#s-guide.on {

}

.ep:focus small, .ep:focus .pl {
  color: var(--on-acc);
  opacity: .85;
}

.pers:focus {
  outline: .22rem solid var(--acc);
  outline-offset: 3px;
}

.nit:focus {
  background: var(--acc);
  color: var(--on-acc);
  box-shadow: none;
}

.nit:focus .dot {
  color: var(--on-acc);
  background: #00000026;
}

.hhero .hp:focus {
  box-shadow: 0 0 0 .25rem var(--acc), 0 0 2.4rem -.2rem var(--acc);
}

.inp:focus-within {
  box-shadow: 0 0 2rem -.6rem var(--acc);
}

:root:not([data-touch]) #s-vod .card:focus .po:after {
  content: "OK  ⓘ  Info";
  z-index: 3;
  background: var(--acc);
  color: var(--on-acc);
  letter-spacing: .02em;
  white-space: pre;
  border-radius: 99px;
  padding: .3rem .7rem;
  font-size: .82rem;
  font-weight: 800;
  line-height: 1.2;
  position: absolute;
  top: .55rem;
  right: .55rem;
  box-shadow: 0 .3rem .9rem #00000073;
}

.hrc .rcc:focus {
  box-shadow: 0 0 0 .25rem var(--acc), 0 0 3rem -.2rem var(--acc), 0 1.5rem 3rem #00000080;
  background: #3ee0a029;
  outline: none;
  transform: scale(1.04);
}

.hrc .rcc {
  transition: transform .15s, box-shadow .15s;
}

#s-home .ht, #s-home .hfav, #s-home .hrc .rcc, #s-home .card .po {
  will-change: transform;
  transition: transform .14s;
}

:root {
  --epc: var(--acc);
}

.ep .ck {
  display: none;
}

.ep.seen .th:before {
  content: "";
  background: #0000008c;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.ep.seen .ck {
  color: #fff;
  place-items: center;
  display: grid;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: 0;
}

.ep .ck .ic {
  stroke-width: 2.6px;
  filter: drop-shadow(0 2px 6px #0009);
  width: 2.6rem;
  height: 2.6rem;
}

.ep.seen .th > b {
  visibility: hidden;
}

.ep.seen:not(:focus) .tx > b, .ep.seen:not(:focus) .tx > small, .ep.seen:not(:focus) .tx > .pl {
  opacity: .6;
}

.ep .est {
  color: var(--tx2);
  align-items: center;
  gap: .8rem;
  margin-top: .3rem;
  font-size: .95rem;
  font-weight: 700;
  display: flex;
}

.ep .est > span {
  white-space: nowrap;
  align-items: center;
  gap: .35rem;
  display: inline-flex;
}

.ep .est .ic {
  stroke-width: 3px;
  width: 1.1rem;
  height: 1.1rem;
}

.ep .etb {
  background: #ffffff2e;
  border-radius: 1rem;
  flex: 1;
  max-width: 22rem;
  height: .4rem;
  display: block;
  position: relative;
  overflow: hidden;
}

.ep .etb > i {
  background: var(--epc);
  border-radius: 1rem;
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  right: auto;
}

.ep .est.eok {
  color: var(--epc);
}

.ep.seen .etb > i {
  opacity: .75;
}

.ep .est.enx > span {
  color: var(--epc);
  background: #ffffff1a;
  border-radius: 1rem;
  padding: .15rem .65rem;
}

.ep:focus .est, .ep:focus .est.eok {
  color: var(--epf-tx, var(--on-acc));
}

.ep:focus .etb {
  background: #0003;
}

.ep:focus .etb > i {
  background: var(--epf-bar, var(--on-acc));
  opacity: 1;
}

.ep:focus .est.enx > span {
  color: var(--epf-tx, var(--on-acc));
  background: #0000002e;
}

:root[data-accent="wald"] {
  --bg: #12201a;
  --bg2: #0f1b16;
  --s1: #1a2b23;
  --s2: #213429;
  --s3: #2b4236;
  --line: #2a3f34;
  --tx: #f2ebdc;
  --tx2: #bcc2b0;
  --tx3: #8a9c8f;
  --acc: #f2ebdc;
  --acc2: #d6bf8e;
  --acc-bg: #f2ebdc1f;
  --on-acc: #12201a;
  --sand: #d6bf8e;
  --panel: #1a2b23f0;
  --railbg: #0f1b16;
  --r: .8rem;
  --r2: 1.3rem;
  --hf: "Fraunces", Georgia, serif;
  --epc: #d6bf8e;
  --epf-tx: #12201a;
  --epf-bar: #3f6b4f;
}

:root[data-accent="wald"] body, :root[data-accent="wald"] #s-home, :root[data-accent="wald"][data-bg] body {
  background: var(--bg);
}

:root[data-accent="wald"] body, :root[data-accent="wald"] #bn button {
  font-family: Manrope, Inter, system-ui, sans-serif;
}

:root[data-accent="wald"] #lgv2 stop {
  stop-color: #1a2b23;
}

:root[data-accent="wald"] #mxm stop {
  stop-color: #d6bf8e;
}

:root[data-accent="wald"] .wm {
  font-family: var(--hf);
  letter-spacing: -.01em;
  text-transform: lowercase;
  margin-right: 0;
  font-weight: 600;
  display: inline-block;
}

:root[data-accent="wald"] .wm:first-letter {
  text-transform: uppercase;
}

:root[data-accent="wald"] .htop .brand .wm {
  letter-spacing: -.01em;
  font-size: 2rem;
}

:root[data-accent="wald"] .wm small {
  text-transform: uppercase;
  letter-spacing: .3em;
  color: var(--sand);
  font-family: Manrope, sans-serif;
  font-weight: 700;
}

:root[data-accent="wald"] .htop .brand .wm small {
  margin-top: .25em;
  font-size: .36em;
}

@media (max-width: 700px), (max-height: 500px) and (pointer: coarse) {
  :root[data-accent="wald"] .htop .brand .wm {
    display: none;
  }
}

@media (max-width: 400px) {
  #s-home .htop {
    gap: .7rem;
  }
}

:root[data-accent="wald"] .wm i {
  color: var(--sand);
}

:root[data-accent="wald"] h1, :root[data-accent="wald"] h2, :root[data-accent="wald"] h3, :root[data-accent="wald"] .hrow h4, :root[data-accent="wald"] .ht b, :root[data-accent="wald"] .hfav b, :root[data-accent="wald"] .det h1, :root[data-accent="wald"] .vhero h1, :root[data-accent="wald"] .vhero h2, :root[data-accent="wald"] .set h2, :root[data-accent="wald"] .dlg h2, :root[data-accent="wald"] .dlg h3 {
  font-family: var(--hf);
  letter-spacing: -.015em;
  font-weight: 600;
}

:root[data-accent="wald"] .hrow h4 {
  text-shadow: none;
  font-size: 1.6rem;
}

:root[data-accent="wald"] .hrow h4 small {
  letter-spacing: 0;
  font-family: Manrope, sans-serif;
  font-weight: 600;
}

:root[data-accent="wald"] .glassy, :root[data-accent="wald"] .ht, :root[data-accent="wald"] .hfav, :root[data-accent="wald"] .hfav.hset, :root[data-accent="wald"] .hnav, :root[data-accent="wald"] .hsb, :root[data-accent="wald"] .hsr, :root[data-accent="wald"] .ht.live, :root[data-accent="wald"] .ht.movie, :root[data-accent="wald"] .ht.series, :root[data-accent="wald"] #s-home .htop .chip {
  background: var(--s1);
  box-shadow: none;
  border: 0;
}

:root[data-accent="wald"] #s-home .htop .chip:focus {
  background: var(--acc);
  color: var(--on-acc);
}

:root[data-accent="wald"] .hfav:before, :root[data-accent="wald"] .ht.img:after {
  content: none;
}

:root[data-accent="wald"] .dlg {
  background: var(--s1);
  border: 1px solid var(--line);
